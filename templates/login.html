{% extends "base.html" %}

{% block title %}ورود | سامانه جامع دانشگاهی{% endblock %}

{% block content %}
<div class="bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <div class="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800">سامانه جامع دانشگاهی</h2>
            <p class="text-gray-500 text-sm mt-1">خوش آمدید، لطفا نقش خود را انتخاب کرده و وارد شوید</p>
        </div>

        <form action="/login" method="POST" class="space-y-5">
            <div>
                <label class="block text-gray-700 text-sm font-semibold mb-2">نقش کاربری</label>
                <select id="role" name="role" onchange="updateLabels()" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
                    <option value="student">دانشجو</option>
                    <option value="professor">استاد</option>
                    <option value="admin">مدیر سیستم (ادمین)</option>
                </select>
            </div>

            <div>
                <label id="username-label" class="block text-gray-700 text-sm font-semibold mb-2">شماره دانشجویی</label>
                <input type="text" name="username" placeholder="نام کاربری خود را وارد کنید" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-left placeholder:text-right transition" required>
            </div>

            <div>
                <label id="password-label" class="block text-gray-700 text-sm font-semibold mb-2">کد ملی (رمز عبور)</label>
                <input type="password" name="password" placeholder="رمز عبور خود را وارد کنید" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-left placeholder:text-right transition" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 active:scale-95 shadow-lg shadow-blue-200 transition duration-150">
                ورود به پنل کاربری
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function updateLabels() {
        const role = document.getElementById('role').value;
        const usernameLabel = document.getElementById('username-label');
        const passwordLabel = document.getElementById('password-label');

        if (role === 'student') {
            usernameLabel.innerText = "شماره دانشجویی";
            passwordLabel.innerText = "کد ملی (رمز عبور)";
        } else if (role === 'professor') {
            usernameLabel.innerText = "کد استادی";
            passwordLabel.innerText = "کد ملی (رمز عبور)";
        } else {
            usernameLabel.innerText = "نام کاربری ادمین";
            passwordLabel.innerText = "کلمه عبور ادمین";
        }
    }
</script>
{% endblock %}
